- name: Simple Ansible Test Playbook
  hosts: devops
  become: true

  tasks:

    - name: Install Nginx
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Start and enable nginx
      service:
        name: nginx
        state: started
        enabled: true

    - name: Create index page
      copy:
        dest: /var/www/html/index.html
        content: |
          <h1>Hello from Ansible! Zhantemir was here 🚀</h1>
